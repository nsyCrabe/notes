<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Notes</h1>
      <button id="newNoteBtn" title="Nouvelle note">+</button>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="Rechercher...">
    </div>
    <ul id="notesList"></ul>
  </aside>

  <main id="editor">
    <div id="emptyState">
      <p>Sélectionne une note ou crée-en une nouvelle ✨</p>
    </div>
    <div id="editorView" class="hidden">
      <input id="noteTitle" type="text" placeholder="Titre">
      <textarea id="noteBody" placeholder="Écris quelque chose..."></textarea>
      <div class="editor-footer">
        <span id="saveStatus"></span>
        <button id="deleteBtn" title="Supprimer">Supprimer</button>
      </div>
    </div>
  </main>
</div>

<button id="menuToggle" aria-label="Menu">☰</button>

<script src="app.js"></script>
</body>
</html>
